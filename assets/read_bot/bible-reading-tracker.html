<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Reading Tracker</title>
  <style>
    :root {
      --primary: #7B1113;
      --primary-light: #f5e0e0;
      --primary-dark: #5a0c0e;
      --accent: #A0522D;
      --bg: #f8f4f0;
      --card: #ffffff;
      --text: #2c2c2c;
      --text-light: #6b6b6b;
      --border: #ddd;
      --ot-color: #7B1113;
      --nt-color: #7F1734;
      --complete: #A0522D;
      --radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 0 10px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    /* Lang toggle */
    .lang-toggle {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 200;
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--primary);
      background: #fff;
    }

    .lang-toggle button {
      padding: 6px 14px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      background: #fff;
      color: var(--primary);
      transition: all 0.2s;
    }

    .lang-toggle button.active {
      background: var(--primary);
      color: #fff;
    }

    #dashboard {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: var(--radius);
      padding: 28px 24px;
      margin: 20px 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      overflow: visible;
    }

    .dashboard-img {
      position: absolute;
      top: -140px;
      right: 10px;
      width: 150px;
      height: auto;
      pointer-events: none;
    }

    .stat-card {
      text-align: center;
    }

    .stat-card .label {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .stat-card .sub {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 2px;
    }

    #dailyCard .value {
      color: var(--accent);
      font-size: 2.6rem;
    }

    .progress-wrap {
      margin: 6px 0 0;
      grid-column: 1 / -1;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      height: 18px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--accent), #f0c95e);
      transition: width 0.5s ease;
      min-width: 0;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      opacity: 0.85;
      margin-top: 4px;
    }

    #completionBanner {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 10px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffe88a;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #ffe88a;
      }

      to {
        text-shadow: 0 0 20px #ffe88a, 0 0 40px var(--accent);
      }
    }

    .hint {
      font-size: 0.82rem;
      color: var(--text-light);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--card);
      border-radius: 6px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .controls button {
      padding: 8px 18px;
      border: 2px solid var(--primary);
      background: #fff;
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .controls button:hover {
      background: var(--primary);
      color: #fff;
    }

    .controls button.danger {
      border-color: #c0392b;
      color: #c0392b;
    }

    .controls button.danger:hover {
      background: #c0392b;
      color: #fff;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 24px 0 12px;
      padding-left: 12px;
      border-left: 4px solid var(--ot-color);
    }

    .section-title.nt {
      border-left-color: var(--nt-color);
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 6px;
    }

    .book-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .book-card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .book-card.checked {
      background: var(--primary-light);
      border-color: var(--complete);
    }

    .book-card .book-header {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .book-card .book-header input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--complete);
      cursor: pointer;
      flex-shrink: 0;
    }

    .book-card .book-name {
      font-weight: 600;
      font-size: 0.8rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-card .book-ch {
      font-size: 0.68rem;
      color: var(--text-light);
      flex-shrink: 0;
    }

    .book-card .book-total {
      display: none;
    }

    .book-card .partial-input {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .book-card.expanded .partial-input {
      display: flex;
    }

    .book-card .partial-input input {
      width: 48px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.82rem;
      text-align: center;
    }

    .book-card .partial-input input:disabled {
      background: var(--primary-light);
      color: var(--complete);
      border-color: var(--complete);
    }

    .book-card .complete-badge {
      display: none;
      font-size: 0.68rem;
      color: var(--complete);
      font-weight: 700;
    }

    .book-card.checked .complete-badge {
      display: inline;
      margin-left: 4px;
    }

    .book-card.checked .partial-input {
      display: none !important;
    }

    .book-card.checked.expanded .partial-input {
      display: none !important;
    }

    #encouragement {
      text-align: center;
      margin: 24px 0;
      padding: 20px 24px;
      background: var(--card);
      border-radius: var(--radius);
      color: var(--primary-dark);
      border: 1.5px solid var(--primary-light);
    }

    .verse-text {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.7;
    }

    .verse-ref {
      font-size: 0.82rem;
      color: var(--text-light);
      margin-top: 6px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      #dashboard {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 20px 16px;
      }

      .book-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }

      header h1 {
        font-size: 1.4rem;
      }
    }

    .site-footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .site-footer a {
      color: var(--text-light);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    .site-footer a:hover {
      color: var(--primary);
    }

    .site-footer .visitor-counter {
      height: 15px;
      vertical-align: text-bottom;
      margin-left: 0.4rem;
      opacity: 0.75;
    }
  </style>
</head>

        ko: '"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"',
        en: '"In the beginning was the Word, and the Word was with God, and the Word was God."',
        refKo: '요한복음 1:1', refEn: 'John 1:1'
      },
      {
        ko: '"내가 주의 규례들을 묵상하며 주의 도에 주의하며 주의 율례들을 즐거워하며 주의 말씀을 잊지 아니하리이다"',
        en: '"I meditate on your precepts and consider your ways. I delight in your decrees; I will not neglect your word."',
        refKo: '시편 119:15-16', refEn: 'Psalm 119:15-16'
      },
    ];

    const I18N = {
      ko: {
        title: '성경 통독 진도 계산기',
        daily: '하루 필요 장수',
        read: '읽은 장수',
        remainLabel: '남은 일수',
        remainSub: (n) => '남은 ' + n.toLocaleString() + '장',
        progressLeft: (r) => r.toLocaleString() + ' / 1,189장',
        completion: '축하합니다! 성경 통독을 완료했습니다!',
        dailyVal: (n) => n + '장',
        dailyExact: (n) => '(정확히는 ' + n.toFixed(1) + '장)',
        hint: '💡 카드를 클릭하면 읽은 장수를 입력할 수 있습니다.',
        selectOT: '구약 전체 선택',
        selectNT: '신약 전체 선택',
        reset: '전체 초기화',
        otTitle: '구약 (39권 \u00B7 929장)',
        ntTitle: '신약 (27권 \u00B7 260장)',
        totalCh: (n) => '총 ' + n + '장',
        chRead: '장 읽음',
        complete: '완독!',
        dateInfo: (d, days) => d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) + ' \u00B7 올해 남은 일수: ' + days + '일',
      },
      en: {
        title: 'Bible Reading Tracker',
        daily: 'Chapters / Day',
        read: 'Chapters Read',
        remainLabel: 'Days Left',
        remainSub: (n) => n.toLocaleString() + ' ch. remaining',
        progressLeft: (r) => r.toLocaleString() + ' / 1,189 ch.',
        completion: 'Congratulations! You have completed the Bible!',
        dailyVal: (n) => n + ' ch.',
        dailyExact: (n) => '(exactly ' + n.toFixed(1) + ' ch.)',
        hint: '💡 Click a card to enter partial progress (chapters read so far).',
        selectOT: 'Select All OT',
        selectNT: 'Select All NT',
        reset: 'Reset All',
        otTitle: 'Old Testament (39 books \u00B7 929 ch.)',
        ntTitle: 'New Testament (27 books \u00B7 260 ch.)',
        totalCh: (n) => n + ' ch.',
        chRead: 'ch. read',
        complete: 'Done!',
        dateInfo: (d, days) => d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + ' \u00B7 Days left this year: ' + days,
      }
    };

    const TOTAL = 1189;
    const STORAGE_KEY = 'bible_reading_progress';
    const LANG_KEY = 'bible_tracker_lang';
    let lang = localStorage.getItem(LANG_KEY) || 'en';
    let pickedVerse = null;

    function t() { return I18N[lang]; }

    function getToday() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function getRemainingDays() {
      const today = getToday();
      const endOfYear = new Date(today.getFullYear(), 11, 31);
      return Math.max(Math.floor((endOfYear - today) / 86400000) + 1, 1);
    }

    function setLang(l) {
      lang = l;
      localStorage.setItem(LANG_KEY, l);
      document.getElementById('btnKo').classList.toggle('active', l === 'ko');
      document.getElementById('btnEn').classList.toggle('active', l === 'en');
      document.documentElement.lang = l;
      applyLang();
      update();
    }

    function applyLang() {
      const s = t();
      document.getElementById('pageTitle').textContent = s.title;
      document.getElementById('dateInfo').textContent = s.dateInfo(getToday(), getRemainingDays());
      document.getElementById('lblDaily').textContent = s.daily;
      document.getElementById('lblRead').textContent = s.read;
      document.getElementById('lblRemainDays').textContent = s.remainLabel;
      document.getElementById('btnSelectOT').textContent = s.selectOT;
      document.getElementById('btnSelectNT').textContent = s.selectNT;
      document.getElementById('btnReset').textContent = s.reset;
      document.getElementById('otTitle').textContent = s.otTitle;
      document.getElementById('ntTitle').textContent = s.ntTitle;
      document.getElementById('completionBanner').textContent = s.completion;
      document.getElementById('hintPartial').textContent = s.hint;
      // Update card labels
      BOOKS.forEach((book, i) => {
        const card = document.querySelector(`.book-card[data-index="${i}"]`);
        if (!card) return;
        card.querySelector('.book-name').textContent = book[lang];
        card.querySelector('.partial-input span').textContent = s.chRead;
        card.querySelector('.complete-badge').textContent = s.complete;
      });
    }

    function buildCards() {
      const otGrid = document.getElementById('otGrid');
      const ntGrid = document.getElementById('ntGrid');
      BOOKS.forEach((book, i) => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.dataset.index = i;
        card.innerHTML = `
      <div class="book-header" onclick="toggleExpand(${i}, event)">
        <input type="checkbox" id="cb${i}" onchange="onCheck(${i})" onclick="event.stopPropagation()">
        <label class="book-name">${book[lang]}</label>
        <span class="book-ch">${book.ch}</span>
        <span class="complete-badge"></span>
      </div>
      <div class="book-total"></div>
      <div class="partial-input">
        <input type="number" id="pi${i}" min="0" max="${book.ch}" value="0"
               oninput="onPartial(${i})" placeholder="0" onclick="event.stopPropagation()">
        <span></span>
      </div>
    `;
        (book.t === 'ot' ? otGrid : ntGrid).appendChild(card);
      });
    }

    function toggleExpand(i, e) {
      const card = document.querySelector(`.book-card[data-index="${i}"]`);
      if (card.classList.contains('checked')) return;
      card.classList.toggle('expanded');
    }

    function onCheck(i) {
      const cb = document.getElementById('cb' + i);
      const pi = document.getElementById('pi' + i);
      const card = cb.closest('.book-card');
      if (cb.checked) {
        card.classList.add('checked');
        card.classList.remove('expanded');
        pi.disabled = true;
      } else {
        card.classList.remove('checked');
        pi.disabled = false;
      }
      update();
      saveProgress();
    }

    function onPartial(i) {
      const pi = document.getElementById('pi' + i);
      let v = parseInt(pi.value) || 0;
      if (v < 0) v = 0;
      if (v > BOOKS[i].ch) v = BOOKS[i].ch;
      pi.value = v || '';
      if (v === BOOKS[i].ch) {
        document.getElementById('cb' + i).checked = true;
        onCheck(i);
        return;
      }
      update();
      saveProgress();
    }

    function selectAll(type) {
      BOOKS.forEach((book, i) => {
        if (book.t === type) {
          document.getElementById('cb' + i).checked = true;
          onCheck(i);
        }
      });
    }

    function resetAll() {
      BOOKS.forEach((_, i) => {
        document.getElementById('cb' + i).checked = false;
        document.getElementById('pi' + i).value = '';
        document.getElementById('pi' + i).disabled = false;
        document.getElementById('cb' + i).closest('.book-card').classList.remove('checked');
      });
      update();
      saveProgress();
    }

    function getReadCount() {
      let total = 0;
      BOOKS.forEach((book, i) => {
        if (document.getElementById('cb' + i).checked) {
          total += book.ch;
        } else {
          total += parseInt(document.getElementById('pi' + i).value) || 0;
        }
      });
      return total;
    }

    function getVerseHTML() {
      if (!pickedVerse) pickedVerse = VERSES[Math.floor(Math.random() * VERSES.length)];
      const v = pickedVerse;
      const text = lang === 'ko' ? v.ko : v.en;
      const ref = lang === 'ko' ? v.refKo : v.refEn;
      return `<div class="verse-text">${text}</div><div class="verse-ref">- ${ref}</div>`;
    }

    function update() {
      const s = t();
      const read = getReadCount();
      const remain = TOTAL - read;
      const days = getRemainingDays();
      const pct = ((read / TOTAL) * 100).toFixed(1);

      document.getElementById('readChapters').textContent = read.toLocaleString();
      document.getElementById('readPercent').textContent = pct + '%';
      document.getElementById('remainChapters').textContent = s.remainSub(remain);
      document.getElementById('remainDays').textContent = days;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressLeft').textContent = s.progressLeft(read);
      document.getElementById('progressRight').textContent = pct + '%';

      const banner = document.getElementById('completionBanner');

      if (remain <= 0) {
        banner.style.display = 'block';
        document.getElementById('dailyChapters').textContent = s.dailyVal(0);
        document.getElementById('dailyExact').textContent = '';
      } else {
        banner.style.display = 'none';
        const exact = remain / days;
        const ceil = Math.ceil(exact);
        document.getElementById('dailyChapters').textContent = s.dailyVal(ceil);
        document.getElementById('dailyExact').textContent = s.dailyExact(exact);
      }
      document.getElementById('encouragement').innerHTML = getVerseHTML();
    }

    function saveProgress() {
      const data = BOOKS.map((_, i) => ({
        c: document.getElementById('cb' + i).checked,
        p: parseInt(document.getElementById('pi' + i).value) || 0
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadProgress() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        data.forEach((d, i) => {
          if (i >= BOOKS.length) return;
          if (d.c) {
            document.getElementById('cb' + i).checked = true;
            document.getElementById('pi' + i).disabled = true;
            document.getElementById('cb' + i).closest('.book-card').classList.add('checked');
          } else if (d.p > 0) {
            document.getElementById('pi' + i).value = d.p;
          }
        });
      } catch (e) { }
    }

    // Init
    (function init() {
      buildCards();
      loadProgress();
      setLang(lang);
    })();
  </script>
</body>

</html>
